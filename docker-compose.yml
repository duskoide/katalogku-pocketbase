volumes:
  product_data:
  account_data:

services:
  product-service:
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - product_data:/pb_data
    ports:
      - "8091:8090" # dashboard: port 8091

  account_service:
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - account_data:/pb_data
    ports:
      - "8092:8090" # dashboard: port 8092

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-service
      - account_service
